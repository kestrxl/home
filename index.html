<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="media/favicon.jpg" />
  <title>Accessibility & Shortcut Guides</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #121212;
      color: #e4e4e7;
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 {
      margin-bottom: 2.5rem;
      font-weight: 600;
      color: #ffffff;
    }
    figure {
      margin: 0 0 3rem 0;
    }
    figcaption {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
      color: #a1a1aa;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Quick Reference Guides</h1>

  <figure>
